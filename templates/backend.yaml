apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-conf
  namespace: {{ $.Release.Namespace }}
data:
  db_host: database.{{ $.Release.Namespace }}.svc.cluster.local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ $.Release.Namespace }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend
      containers:
        - name: adminer
          image: {{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ADMINER_DEFAULT_SERVER
              valueFrom:
                configMapKeyRef: {name: backend-conf, key: db_host}
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: {name: {{ .Values.secretName }}, key: username}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.secretName }}, key: password}
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 3
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ $.Release.Namespace }}
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: http
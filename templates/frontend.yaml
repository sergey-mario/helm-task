apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: {{ $.Release.Namespace }}
data:
  backend_host: backend.{{ $.Release.Namespace }}.svc.cluster.local
  default.conf.template: |
    server {
        listen 80;
        server_name _;

        location = / {
            default_type text/plain;
            return 200 "frontend V2, pod: $hostname\n";
        }

        location /api/ {
            proxy_pass http://${WORKSHOP_BACKEND_HOST}:80/;
            proxy_set_header Host $host;
            add_header X-Backend-Addr $upstream_addr always;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ $.Release.Namespace }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      serviceAccountName: frontend
      containers:
        - name: nginx
          image: {{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}
          ports:
            - name: http
              containerPort: 80
          env:
            - name: NGINX_ENVSUBST_FILTER
              value: "WORKSHOP_"
            - name: WORKSHOP_BACKEND_HOST
              valueFrom:
                configMapKeyRef: {name: frontend-config, key: backend_host}
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/templates
              readOnly: true
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: frontend-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ $.Release.Namespace }}
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: http